[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bank-churn-automl"
version = "0.1.0"
description = "Automated ML pipeline for bank churn prediction"
requires-python = ">=3.10"
dependencies = ["pandas>=2.2", "numpy>=1.26", "scikit-learn>=1.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
